# RouteNex v3 lint policy. Compact service code is intentional; path-bootstrap imports are not errors.
target-version = "py311"

[lint]
ignore = ["E702"]

[lint.per-file-ignores]
"scripts/*" = ["E402"]
"migrations/env.py" = ["E402"]
"backend/app/core/security.py" = ["E402"]
"backend/tests/**" = ["E402"]
"ml/train.py" = ["E402"]
