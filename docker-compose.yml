services:
  routenex:
    build: .
    ports: ["8000:8000"]
    environment:
      ROUTENEX_ENV: production
      ROUTENEX_SECRET: ${ROUTENEX_SECRET:?Set ROUTENEX_SECRET (32+ random characters)}
      ROUTENEX_DB: /app/database/routenex.db
      DEMO_MODE: ${DEMO_MODE:-true}
    volumes:
      - ./database:/app/database
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 20s
      timeout: 3s
      retries: 3
